version = 1
disable_existing_loggers = false

[formatters.simple]
format = "%(asctime)s - %(message)s"
datefmt = "%Y-%m-%d %H:%M:%S"

[formatters.detailed]
format = "%(asctime)s  %(levelname)-8s  %(name)s (%(module)s)    %(message)s"
datefmt = "%Y-%m-%d %H:%M:%S%z"

[formatters.json]
format = '{"timestamp": "%(asctime)s", "logger_name": "%(name)s", "level": "%(levelname)s", "module": "%(module)s", "message": "%(message)s"}'
datefmt = "%Y-%m-%d %H:%M:%S%z"

[handlers.stdout]
class = "logging.StreamHandler"
level = "INFO"
formatter = "simple"
stream = "ext://sys.stdout"

[handlers.file]
class = "logging.handlers.RotatingFileHandler"
level = "DEBUG"
formatter = "detailed"
filename = "logs/rota.log"
maxBytes = 1048576  # 2 ** 20
backupCount = 3

[handlers.jsonfile]
class = "logging.handlers.RotatingFileHandler"
level = "DEBUG"
formatter = "json"
filename = "logs/rota.jsonl"
maxBytes = 1048576  # 2 ** 20
backupCount = 3

[loggers.root]
level = "DEBUG"
handlers = ["stdout", "file", "jsonfile"]
